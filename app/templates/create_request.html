{% extends "base.html" %}

{% block title %}Submit a New Request{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Submit a New Grievance or Request</h2>
    <form method="POST" action="{{ url_for('main.create_request') }}">
        <div class="form-group">
            <label for="module">Module</label>
            <select id="module" name="module" class="form-control" required>
                <option value="Exam">Exam</option>
                <option value="Appeals">Appeals</option>
                <option value="Help Desk">Help Desk</option>
                <option value="Class Committee">Class Committee</option>
            </select>
        </div>
        <div class="form-group">
            <label for="type">Request Type</label>
            <input type="text" id="type" name="type" class="form-control" placeholder="e.g., Revaluation, Photocopy, Fee Issue" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Request</button>
    </form>
</div>
{% endblock %}
